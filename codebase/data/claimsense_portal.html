<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaimSense · Review portal · AutoSure (synthetic)</title>
<style>
:root {
  --navy: #0F2D52;
  --ink: #111827;
  --body: #374151;
  --muted: #6B7280;
  --faint: #9CA3AF;
  --line: #E5E7EB;
  --bg: #F9FAFB;
  --card: #FFFFFF;
  --blue: #1D4ED8;
  --blue-bg: #DBEAFE;
  --green: #15803D;
  --green-bg: #DCFCE7;
  --amber: #B45309;
  --amber-bg: #FEF3C7;
  --red: #B91C1C;
  --red-bg: #FEE2E2;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  color: var(--body); background: var(--bg);
}
a { color: var(--blue); }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
code { background: #F3F4F6; padding: 1px 5px; border-radius: 4px; }
pre { background: #0b1220; color: #e5e7eb; padding: 12px 14px; border-radius: 8px; overflow: auto; font-size: 12px; line-height: 1.55; }
pre code { background: none; padding: 0; color: inherit; }

.top {
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  padding: 12px 24px; background: var(--card); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 20;
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo { display: inline-flex; width: 36px; height: 36px; border-radius: 9px; background: var(--navy); color: white; font-weight: 700; align-items: center; justify-content: center; letter-spacing: .02em; }
.title { font-weight: 600; color: var(--ink); font-size: 15px; }
.sub { font-size: 12px; color: var(--muted); }
.muted { color: var(--muted); font-weight: 400; }
.viewas { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.viewas select { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: white; color: var(--ink); }

.tabs { display: flex; gap: 2px; padding: 0 24px; background: var(--card); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button {
  font: inherit; font-size: 13px; padding: 11px 14px; border: 0; background: none; color: var(--muted);
  border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
}
.tabs button:hover { color: var(--ink); }
.tabs button.active { color: var(--navy); border-bottom-color: var(--navy); font-weight: 600; }

main { max-width: 1240px; margin: 0 auto; padding: 22px 24px 60px; }
h1 { font-size: 22px; color: var(--ink); margin: 0 0 6px; font-weight: 600; }
h2 { font-size: 16px; color: var(--navy); margin: 24px 0 10px; font-weight: 600; }
h3 { font-size: 14px; color: var(--ink); margin: 18px 0 6px; font-weight: 600; }
h4 { font-size: 13px; color: var(--ink); margin: 14px 0 4px; font-weight: 600; }
p { margin: 0 0 10px; }
.lead { color: var(--muted); margin-bottom: 18px; }

.grid { display: grid; gap: 12px; }
.grid.kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.kpi .n { font-size: 24px; font-weight: 600; color: var(--ink); line-height: 1.2; }
.kpi .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
.kpi .s { font-size: 11px; color: var(--faint); margin-top: 4px; }
.kpi.accent { border-left: 3px solid var(--navy); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; padding: 9px 10px; border-bottom: 1px solid var(--line); background: #F3F4F6; white-space: nowrap; }
td { padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.mono, td.nowrap { white-space: nowrap; }
.tablewrap table { font-size: 12.5px; }
tr.click { cursor: pointer; }
tr.click:hover td { background: #F3F6FB; }
tr.denied td { color: var(--faint); background: #FAFAFA; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.tablewrap table { border: 0; }
.md table { margin: 8px 0 14px; }
.md th, .md td { font-size: 12.5px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; background: #F3F4F6; color: var(--body); }
.pill.navy { background: var(--navy); color: white; }
.pill.green { background: var(--green-bg); color: var(--green); }
.pill.amber { background: var(--amber-bg); color: var(--amber); }
.pill.red { background: var(--red-bg); color: var(--red); }
.pill.blue { background: var(--blue-bg); color: var(--blue); }
.pill.gray { background: #F3F4F6; color: var(--muted); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 12px; align-items: center; font-size: 12.5px; color: var(--muted); }
.filters select, .filters input { font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: white; }

.bar { height: 8px; background: #E5E7EB; border-radius: 4px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--navy); }
.barrow { display: grid; grid-template-columns: 150px 1fr 40px; gap: 10px; align-items: center; font-size: 12.5px; margin: 4px 0; }
.barrow .num { text-align: right; color: var(--muted); }

.note { border-left: 3px solid var(--navy); background: #F3F6FB; padding: 10px 12px; border-radius: 0 8px 8px 0; margin: 10px 0; font-size: 13px; }
.note.warn { border-color: var(--amber); background: #FFFBEB; }
.note.good { border-color: var(--green); background: #F0FDF4; }
.note.bad { border-color: var(--red); background: #FEF2F2; }

.finding { display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.finding .count { font-size: 26px; font-weight: 600; color: var(--navy); line-height: 1; }
.finding .t { font-weight: 600; color: var(--ink); }
.finding .d { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.finding .ids { margin-top: 5px; display: flex; gap: 5px; flex-wrap: wrap; }
.finding .ids button { font: inherit; font-family: var(--mono); font-size: 11px; padding: 1px 7px; border: 1px solid var(--line); background: white; border-radius: 5px; cursor: pointer; color: var(--blue); }

.subnav { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 16px; }
.subnav button { font: inherit; font-size: 12.5px; padding: 6px 11px; border: 1px solid var(--line); background: white; border-radius: 999px; cursor: pointer; color: var(--body); }
.subnav button.active { background: var(--navy); color: white; border-color: var(--navy); }

.md { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px 26px; max-width: 980px; }
.md h1 { font-size: 20px; margin-top: 0; }
.md h2 { margin-top: 22px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.md ul, .md ol { padding-left: 22px; margin: 6px 0 10px; }
.md li { margin: 3px 0; }
.md blockquote { margin: 8px 0; padding: 6px 12px; border-left: 3px solid var(--line); color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
.md pre { margin: 8px 0 14px; }

.check { display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: #F0FDF4; border-left: 3px solid var(--green); }
.check .box { width: 20px; height: 20px; border-radius: 4px; background: var(--green); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 2px; }
.check .t { font-weight: 600; color: var(--ink); }
.check .d { font-size: 12.5px; color: var(--muted); }
.check .f { font-size: 12px; margin-top: 3px; }

.clause { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
.clause .id { font-family: var(--mono); font-size: 12px; color: var(--navy); font-weight: 600; }
.clause .t { font-weight: 600; color: var(--ink); margin: 2px 0 4px; }
.clause .b { font-size: 13px; }

.drawer-backdrop { position: fixed; inset: 0; background: rgba(17,24,39,.35); display: none; z-index: 30; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 96vw); background: var(--card); box-shadow: -8px 0 30px rgba(0,0,0,.12); transform: translateX(100%); transition: transform .18s ease; z-index: 31; overflow-y: auto; padding: 20px 24px 40px; }
.drawer.open { transform: translateX(0); }
.drawer-backdrop.open { display: block; }
.drawer .close { position: absolute; top: 12px; right: 14px; font: inherit; border: 1px solid var(--line); background: white; border-radius: 6px; padding: 3px 9px; cursor: pointer; }
.kv { display: grid; grid-template-columns: 170px 1fr; gap: 4px 12px; font-size: 13px; }
.kv .k { color: var(--muted); }
.kv .v { color: var(--ink); }
.reco { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 10px; }
.reco .head { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.reco .head.approve { background: var(--green-bg); }
.reco .head.flag { background: var(--amber-bg); }
.reco .head.route { background: var(--blue-bg); }
.reco .head.deny { background: var(--red-bg); }
.reco .body { padding: 10px 14px; font-size: 13px; }
.reco .confirm { padding: 8px 14px; border-top: 1px dashed var(--line); font-size: 12.5px; font-weight: 600; color: var(--navy); background: #F8FAFC; }
.flags { display: flex; gap: 5px; flex-wrap: wrap; }
.evalrow .exp { font-size: 12.5px; }
details { margin: 4px 0; }
summary { cursor: pointer; color: var(--navy); font-weight: 600; font-size: 13px; }
.small { font-size: 12px; color: var(--muted); }
.foot { text-align: center; font-size: 11.5px; color: var(--faint); padding: 18px 24px 30px; border-top: 1px solid var(--line); background: var(--card); }
.denied-note { font-size: 12px; color: var(--red); }
.ai-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; padding: 9px 16px; background: var(--navy); color: white; border: 0; border-radius: 7px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.ai-btn:hover { background: #1a3f6f; }
.ai-btn svg { flex-shrink: 0; }

</style>
</head>

</footer>

limited to the lesser of the reasonable cost\nof repair or the actual cash value (ACV) of the vehicle immediately before the loss,\nreduced by the applicable collision deductible shown on the declarations page.","file":"CLS-COLL-001-collision-coverage.md"},{"id":"CLS-COMP-002","title":"Comprehensive (other-than-collision) coverage","text":"Under Full Coverage policies, loss caused by events other than collision — including\ntheft, vandalism, fire, flood, falling objects, glass breakage, and animal strikes —\nis covered under the comprehensive section, subject to the comprehensive deductible\non the declarations page. Pothole impact is treated as collision, not comprehensive.","file":"CLS-COMP-002-comprehensive-coverage.md"},{"id":"CLS-DED-004","title":"Deductible application","text":"The deductible shown on the declarations page is subtracted from the covered loss\namount before payment. The deductible applies once per occurrence, to first-party\nphysical damage claims only. Deductibles are never applied by the adjudication\nsystem itself: the platform computes the net payable estimate deterministically and\nthe adjuster confirms it.","file":"CLS-DED-004-deductible-application.md"},{"id":"CLS-DOC-009","title":"Duties after loss — documentation","text":"The claimant must submit a completed First Notice of Loss (FNOL), a repair estimate\nfrom a licensed shop, and reasonable proof of the loss. The insurer may delay\nadjudication while required documents remain unprocessed or unreadable. Estimates\nstill pending document processing (OCR) cannot support payment authorization.","file":"CLS-DOC-009-claim-documentation.md"},{"id":"CLS-EXC-010","title":"General exclusions","text":"No coverage applies to: loss while the vehicle is used for racing or speed contests;\nloss while used as a public or livery conveyance unless declared; intentional loss\ncaused by any insured; wear and tear, freezing, or mechanical breakdown absent a\ncovered collision; and loss occurring outside the policy territory.","file":"CLS-EXC-010-general-exclusions.md"},{"id":"CLS-FRD-007","title":"Fraud investigation and referral","text":"The insurer may refer any claim presenting indicators of misrepresentation or a\nstaged loss to the Special Investigation Unit (SIU) before payment. Indicators\ninclude, without limitation: unwitnessed late-night single-vehicle losses, absence\nof a police report where injury or airbag deployment is reported, repair estimates\ninconsistent with the described damage, and multiple prior claims within twelve\nmonths. SIU referral suspends repair authorization until the investigation resolves.","file":"CLS-FRD-007-fraud-investigation.md"},{"id":"CLS-INJ-008","title":"Bodily injury reporting and routing","text":"Claims reporting bodily injury require a filed police report where required by law\nand route to an injury-qualified adjuster. A medical report present on a claim whose\nFNOL reports no injuries is an inconsistency that must be resolved before payment.","file":"CLS-INJ-008-injury-reporting.md"},{"id":"CLS-LIAB-003","title":"Liability Only — scope and exclusion of own-vehicle damage","text":"A Liability Only policy covers bodily injury and property damage the insured becomes\nlegally obligated to pay to third parties. It provides NO coverage for damage to the\ninsured's own vehicle from any cause. First-party repair estimates, total-loss\nvaluations, and rental reimbursement are excluded under Liability Only policies.","file":"CLS-LIAB-003-liability-only-scope.md"},{"id":"CLS-PAY-012","title":"Payment authority","text":"No automated system output constitutes payment authorization. Every adjudication —\nincluding first-pass approvals — is a recommendation requiring confirmation by a\nlicensed human adjuster before any financial transaction. High-value payments\n(net payable above $25,000) require senior-adjuster confirmation.","file":"CLS-PAY-012-payment-authority.md"},{"id":"CLS-PER-006","title":"Policy period and lapse","text":"Coverage applies only to losses occurring during the policy period shown on the\ndeclarations page, from the effective date through the expiration date inclusive.\nA loss occurring after the expiration date is not covered even if a renewal was\noffered, unless the renewal premium was received before the loss. Administrative\nstatus fields do not extend coverage: the controlling facts are the policy period\ndates and the incident date.","file":"CLS-PER-006-policy-period.md"},{"id":"CLS-RNT-011","title":"Rental reimbursement","text":"Where the endorsement is present on a Full Coverage policy, reasonable rental costs\nare reimbursed while the covered vehicle is unusable due to a covered loss, up to\nthe daily and per-occurrence limits on the declarations page. Not available under\nLiability Only policies.","file":"CLS-RNT-011-rental-reimbursement.md"},{"id":"CLS-TL-005","title":"Total loss determination","text":"A vehicle is a total-loss candidate when the reasonable cost of repair equals or\nexceeds seventy-five percent (75%) of the vehicle's actual cash value (ACV)\nimmediately before the loss. Total-loss candidates must be referred to a licensed\ntotal-loss appraiser for valuation before any repair authorization. Settlement on a\ntotal loss is ACV less the applicable deductible and salvage where retained.","file":"CLS-TL-005-total-loss-threshold.md"}],"stats":{"claims":20,"policies":15,"documents":74,"documents_pending":10,"status_counts":{"Approved":6,"Under Investigation":6,"Escalated":2,"Pending Review":6},"total_estimate_usd":268600}};

/* ClaimSense · review portal. Vanilla JS, no build step, works from file://. Shows source data only. */
(function () {
  const D = window.CLAIMSENSE_DATA;
  const $ = (sel, el) => (el || document).querySelector(sel);
  const main = $('#main');
  const state = { tab: 'overview', viewAs: 'bob', claimFilter: { status: '', adjuster: '', q: '' } };

  // ── helpers ──────────────────────────────────────────────────────────────────
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (v) => (v == null || v === '' ? '—' : '$' + Number(v).toLocaleString('en-US', { maximumFractionDigits: 0 }));
  const pill = (text, tone) => `<span class="pill ${tone || ''}">${esc(text)}</span>`;
  const statusTone = { Approved: 'green', 'Pending Review': 'amber', 'Under Investigation': 'red', Escalated: 'blue' };
  const ocrPill = (s) => pill(s, s === 'Completed' ? 'green' : 'amber');
  const policyPill = (s) => pill(s, s === 'Active' ? 'green' : 'red');

  // ── header ──────────────────────────────────────────────────────────────────
  const sel = $('#viewas');
  sel.innerHTML = Object.entries(D.users).map(([u, info]) => `<option value="${u}">${esc(info.name)} (${u})</option>`).join('');
  sel.value = state.viewAs;
  const syncGroup = () => { $('#viewas-group').textContent = D.users[state.viewAs].group; };
  sel.addEventListener('change', () => { state.viewAs = sel.value; syncGroup(); render(); });
  syncGroup();

  $('#tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-tab]'); if (!b) return;
    state.tab = b.dataset.tab; closeDrawer();
    document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('active', x === b));
    render();
  });

  // ── drawer ──────────────────────────────────────────────────────────────────
  const drawer = $('#drawer'), backdrop = $('#backdrop');
  function openDrawer(html) { drawer.innerHTML = `<button class="close" id="dclose">Close</button>` + html; drawer.classList.add('open'); backdrop.classList.add('open'); $('#dclose').onclick = closeDrawer; }
  function closeDrawer() { drawer.classList.remove('open'); backdrop.classList.remove('open'); }
  backdrop.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

  const claimById = Object.fromEntries(D.claims.map((c) => [c.claim_id, c]));
  const policyById = Object.fromEntries(D.policies.map((p) => [p.policy_id, p]));

  window.openConsole = function (claimId, userId, group) {
    const params = new URLSearchParams({ claim_id: claimId, user_id: userId, group });
    window.open('/console?' + params.toString(), '_blank');
  };

  window.openClaim = function (id) {
    const c = claimById[id]; if (!c) return;
    const acc = c.access[state.viewAs];
    if (!acc.allowed) {
      openDrawer(`<h2>${esc(id)}</h2><div class="note bad"><strong>Access denied.</strong><br>${esc(acc.reason)}</div>`);
      return;
    }
    const p = policyById[c.policy_id] || {};
    const docs = c.documents.map((d) => `<tr><td class="mono">${esc(d.document_id)}</td><td>${esc(d.document_type)}</td><td>${esc(d.description)}</td><td>${esc(d.upload_date)}</td><td class="num">${esc(d.page_count)}</td><td>${ocrPill(d.ocr_status)}</td></tr>`).join('');
    openDrawer(`
      <h2 style="margin-top:0">${esc(id)} ${pill(c.claim_status, statusTone[c.claim_status])}</h2>
      <div class="small">Viewing as ${esc(D.users[state.viewAs].name)} · ${esc(D.users[state.viewAs].group)}</div>

      <div class="cols" style="margin-top:14px">
        <div class="card">
          <h3 style="margin-top:0">Claim</h3>
          <div class="kv">
            <div class="k">Vehicle</div><div class="v">${esc(c.vehicle_year)} ${esc(c.vehicle_make)} ${esc(c.vehicle_model)} <span class="small mono">${esc(c.vehicle_vin)}</span></div>
            <div class="k">Incident</div><div class="v">${esc(c.incident_type)} · ${esc(c.incident_date)}</div>
            <div class="k">Description</div><div class="v">${esc(c.incident_description)}</div>
            <div class="k">Damage</div><div class="v">${esc(c.damage_description)}</div>
            <div class="k">Repair estimate</div><div class="v">${money(c.repair_estimate_usd)}</div>
            <div class="k">Vehicle ACV</div><div class="v">${money(c.vehicle_acv_usd)}</div>
            <div class="k">Injuries / police report</div><div class="v">${esc(c.injuries_reported)} / ${esc(c.police_report_filed)}</div>
            <div class="k">Prior claims (12 mo)</div><div class="v">${esc(c.prior_claims_12mo)}</div>
            <div class="k">Fraud risk score</div><div class="v">${esc(c.fraud_risk_score)}</div>
            <div class="k">Assigned</div><div class="v">${esc(c.assigned_adjuster)}</div>
            <div class="k">Created</div><div class="v">${esc(c.created_at)}</div>
          </div>
        </div>
        <div class="card">
          <h3 style="margin-top:0">Policy</h3>
          <div class="kv">
            <div class="k">Policy</div><div class="v mono">${esc(c.policy_id)}</div>
            <div class="k">Holder</div><div class="v">${esc(c.holder)}</div>
            <div class="k">Coverage</div><div class="v">${esc(p.coverage_type)} ${policyPill(p.policy_status)}</div>
            <div class="k">Collision / comp.</div><div class="v">${esc(p.collision_coverage)} / ${esc(p.comprehensive_coverage)}</div>
            <div class="k">Deductibles</div><div class="v">${esc(p.collision_deductible_usd)} / ${esc(p.comprehensive_deductible_usd)}</div>
            <div class="k">Period</div><div class="v">${esc(p.policy_start)} → ${esc(p.policy_end)}</div>
            <div class="k">Liability / MedPay</div><div class="v">${esc(p.liability_limit)} / ${money(p.medpay_limit_usd)}</div>
          </div>
        </div>
      </div>

      <button class="ai-btn" onclick="openConsole('${c.claim_id}','${state.viewAs}','${D.users[state.viewAs].group}')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        Run AI Assessment
      </button>
      <h3>Documents (${c.documents.length})</h3>
      <div class="tablewrap"><table><thead><tr><th>Id</th><th>Type</th><th>Description</th><th>Uploaded</th><th class="num">Pages</th><th>OCR</th></tr></thead><tbody>${docs || '<tr><td colspan="6" class="small">No documents</td></tr>'}</tbody></table></div>
    `);
  };

  // ── views ───────────────────────────────────────────────────────────────────
  function overview() {
    const st = D.stats;
    const statuses = Object.entries(st.status_counts).sort((a, b) => b[1] - a[1]);
    const max = Math.max(...statuses.map((s) => s[1]));
    const visible = D.claims.filter((c) => c.access[state.viewAs].allowed).length;
    return `
      <h1>${esc(D.client)}</h1>
      <p class="lead">Claims, policies, documents and the policy manual.</p>
      <div class="grid kpis">
        <div class="kpi accent"><div class="n">${st.claims}</div><div class="l">claims</div><div class="s">${visible} visible to ${esc(state.viewAs)}</div></div>
        <div class="kpi"><div class="n">${st.policies}</div><div class="l">policies</div></div>
        <div class="kpi"><div class="n">${st.documents}</div><div class="l">documents</div><div class="s">${st.documents_pending} pending OCR</div></div>
        <div class="kpi"><div class="n">${D.corpus.length}</div><div class="l">manual clauses</div></div>
        <div class="kpi"><div class="n">${money(st.total_estimate_usd)}</div><div class="l">total repair estimates</div></div>
      </div>
      <div class="card" style="margin-top:16px;max-width:560px">
        <h3 style="margin-top:0">Claim status</h3>
        ${statuses.map(([s, n]) => `<div class="barrow"><div>${pill(s, statusTone[s])}</div><div class="bar"><span style="width:${(n / max) * 100}%"></span></div><div class="num">${n}</div></div>`).join('')}
      </div>`;
  }

  function claims() {
    const f = state.claimFilter;
    const rows = D.claims.filter((c) => (!f.status || c.claim_status === f.status) && (!f.adjuster || c.assigned_adjuster === f.adjuster) &&
      (!f.q || [c.claim_id, c.holder, c.vehicle_make, c.vehicle_model, c.incident_type, c.policy_id].join(' ').toLowerCase().includes(f.q.toLowerCase())));
    const me = D.users[state.viewAs];
    const denied = rows.filter((c) => !c.access[state.viewAs].allowed).length;
    return `
      <h1>Claims</h1>
      <p class="lead">Rows the selected user cannot read are greyed out. Click a row to open the claim.</p>
      <div class="filters">
        <span>Viewing as <strong>${esc(me.name)}</strong> ${pill(me.group, 'navy')} — ${rows.length - denied} of ${rows.length} readable</span>
        <select id="f-status"><option value="">All statuses</option>${Object.keys(D.stats.status_counts).map((s) => `<option ${f.status === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
        <select id="f-adj"><option value="">All assignees</option>${Object.keys(D.users).map((u) => `<option value="${u}" ${f.adjuster === u ? 'selected' : ''}>${u}</option>`).join('')}</select>
        <input id="f-q" placeholder="Search id, holder, vehicle, incident" value="${esc(f.q)}">
      </div>
      <div class="tablewrap"><table>
        <thead><tr><th>Claim</th><th>Holder / vehicle</th><th>Incident</th><th>Coverage</th><th class="num">Estimate</th><th class="num">ACV</th><th class="num">Fraud score</th><th>Assigned</th><th>Status</th></tr></thead>
        <tbody>${rows.map((c) => {
          const ok = c.access[state.viewAs].allowed;
          return `<tr class="click ${ok ? '' : 'denied'}" onclick="openClaim('${c.claim_id}')">
            <td class="mono">${esc(c.claim_id)}</td>
            <td class="nowrap">${esc(c.holder)}<div class="small">${esc(c.vehicle_year)} ${esc(c.vehicle_make)} ${esc(c.vehicle_model)}</div></td>
            <td class="nowrap">${esc(c.incident_type)}<div class="small">${esc(c.incident_date)}</div></td>
            <td class="nowrap">${esc(c.coverage_type)}<div>${policyPill(c.policy_status)}</div></td>
            <td class="num">${money(c.repair_estimate_usd)}</td>
            <td class="num">${money(c.vehicle_acv_usd)}</td>
            <td class="num">${esc(c.fraud_risk_score)}</td>
            <td>${esc(c.assigned_adjuster)}</td>
            <td>${pill(c.claim_status, statusTone[c.claim_status])}</td>
          </tr>`; }).join('')}</tbody>
      </table></div>`;
  }

  function policies() {
    return `
      <h1>Policies</h1>
      <p class="lead">Declarations for each policy.</p>
      <div class="tablewrap"><table>
        <thead><tr><th>Policy</th><th>Holder</th><th>Vehicle</th><th class="num">ACV</th><th>Coverage</th><th>Coll / Comp</th><th>Deductibles</th><th>Liability</th><th class="num">MedPay</th><th>Status</th><th>Period</th><th>Claims</th></tr></thead>
        <tbody>${D.policies.map((p) => {
          const cl = D.claims.filter((c) => c.policy_id === p.policy_id);
          return `<tr>
            <td class="mono">${esc(p.policy_id)}</td><td>${esc(p.holder_first)} ${esc(p.holder_last)}</td>
            <td>${esc(p.vehicle_year)} ${esc(p.vehicle_make)} ${esc(p.vehicle_model)}</td><td class="num">${money(p.vehicle_acv_usd)}</td>
            <td>${esc(p.coverage_type)}</td><td>${esc(p.collision_coverage)} / ${esc(p.comprehensive_coverage)}</td>
            <td>${esc(p.collision_deductible_usd)} / ${esc(p.comprehensive_deductible_usd)}</td><td>${esc(p.liability_limit)}</td><td class="num">${money(p.medpay_limit_usd)}</td>
            <td>${policyPill(p.policy_status)}</td><td class="small">${esc(p.policy_start)} → ${esc(p.policy_end)}</td>
            <td>${cl.map((c) => `<button class="mono" style="font:inherit;font-size:11px;border:1px solid var(--line);background:white;border-radius:5px;padding:1px 6px;cursor:pointer;color:var(--blue)" onclick="openClaim('${c.claim_id}')">${c.claim_id}</button>`).join(' ')}</td>
          </tr>`; }).join('')}</tbody>
      </table></div>`;
  }

  function documents() {
    return `
      <h1>Documents</h1>
      <p class="lead">${D.stats.documents} documents, ${D.stats.documents_pending} pending OCR. Click a row to open its claim.</p>
      <div class="tablewrap"><table>
        <thead><tr><th>Document</th><th>Claim</th><th>Type</th><th>Description</th><th>Uploaded</th><th class="num">Pages</th><th>OCR</th><th>By</th></tr></thead>
        <tbody>${D.documents.map((d) => `<tr class="click" onclick="openClaim('${d.claim_id}')">
          <td class="mono">${esc(d.document_id)}</td><td class="mono">${esc(d.claim_id)}</td><td>${esc(d.document_type)}</td><td>${esc(d.description)}</td>
          <td>${esc(d.upload_date)}</td><td class="num">${esc(d.page_count)}</td><td>${ocrPill(d.ocr_status)}</td><td>${esc(d.uploaded_by)}</td></tr>`).join('')}</tbody>
      </table></div>`;
  }

  function manual() {
    return `
      <h1>Policy manual <span class="muted">· ${D.corpus.length} clauses</span></h1>
      ${D.corpus.map((c) => `<div class="clause"><div class="id">${esc(c.id)}</div><div class="t">${esc(c.title)}</div><div class="b">${esc(c.text)}</div></div>`).join('')}`;
  }

  function render() {
    const views = { overview, claims, policies, documents, manual };
    main.innerHTML = views[state.tab]();
    if (state.tab === 'claims') {
      $('#f-status').onchange = (e) => { state.claimFilter.status = e.target.value; render(); };
      $('#f-adj').onchange = (e) => { state.claimFilter.adjuster = e.target.value; render(); };
      const q = $('#f-q'); q.oninput = (e) => { state.claimFilter.q = e.target.value; render(); $('#f-q').focus(); $('#f-q').setSelectionRange(q.value.length, q.value.length); };
    }
  }
  render();
})();
</script>
</body>
</html>
