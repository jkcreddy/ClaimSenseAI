[project]
name = "claimsenseai"
version = "0.1.0"
description = "ClaimSense AI — P&C claims co-pilot"
readme = "README.md"
requires-python = ">=3.12.14"
dependencies = [
    "boto3>=1.35.0",
    "fastapi>=0.115.0",
    "litellm>=1.55.0",
    "openai-agents[litellm]>=0.20.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["codebase"]
testpaths = ["codebase/tests"]

[tool.uvicorn]
app = "src.api.main:app"
host = "0.0.0.0"
port = 8080
reload = true
